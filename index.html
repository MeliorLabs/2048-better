<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2048 Better</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>2048</h1>
      <div class="scores">
        <div class="box"><span>Score</span><b id="score">0</b></div>
        <div class="box"><span>Best</span><b id="best">0</b></div>
      </div>
    </header>

    <p class="hint">Join the tiles. Reach <b>2048</b>. Arrow keys, WASD, or swipe.</p>

    <div class="buttons">
      <button id="undo">Undo</button>
      <button id="restart">New game</button>
    </div>

    <div id="board"></div>

    <div id="overlay" class="hidden">
      <p id="overlay-text"></p>
      <button id="overlay-btn">Try again</button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
